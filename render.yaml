services:
  - type: web
    name: primeraapi
    env: java
    buildCommand: ./mvnw clean compile
    startCommand: java -jar target/*.jar --spring.profiles.active=prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: primeraapi-db
          property: connectionString

databases:
  - name: primeraapi-db
    plan: free