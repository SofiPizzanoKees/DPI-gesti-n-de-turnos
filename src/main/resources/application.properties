# Nombre de la aplicación
spring.application.name=primeraapi

# Configuración de la base de datos PostgreSQL
# Render provee DATABASE_URL en el formato: postgres://usuario:password@host:puerto/dbname
# Spring Boot necesita el formato jdbc:postgresql://host:puerto/dbname
spring.datasource.url=jdbc:mysql://localhost:3306/dpi_bd?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



