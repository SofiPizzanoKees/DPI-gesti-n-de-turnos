# Configuración para LOCAL y RENDER
spring.application.name=primeraapi

# Puerto dinámico para Render (usa 8081 localmente)
server.port=${PORT:8081}

# Configuración de BD - LOCAL PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dpi_bd
spring.datasource.username=postgres
spring.datasource.password=tu_password_local

# Configuración JPA/Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8