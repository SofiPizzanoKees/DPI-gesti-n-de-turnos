# Nombre de la aplicación
spring.application.name=primeraapi

# Puerto del servidor (Render asigna uno automáticamente)
server.port=${PORT:8080}

# Base de datos PostgreSQL de Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# SendGrid Configuration
spring.sendgrid.api-key=${SENDGRID_API_KEY}
app.email.from=dpi.vallemedio1@gmail.com
app.email.from-name=Centro Médico DPI

# Logging
logging.level.com.dpi.primeraapi=INFO
logging.level.org.springframework=WARN

# Production settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PostgreSQL connection settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000