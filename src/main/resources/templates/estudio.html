<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Estudio - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>
  
  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>
  
  <!-- Logo -->
  <main class="container">
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>

    <h3 class="title">Seleccionar Estudio Médico</h3>

<!-- En estudio.html, después del logo y antes del formulario -->
<div th:if="${rolUsuario == 'SECRETARIO'}" class="paciente-info" 
     style="background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #007bff;">
    <h4>Paciente Seleccionado</h4>
    <p><strong>Nombre:</strong> <span th:text="${paciente.nombre + ' ' + paciente.apellido}"></span></p>
    <p><strong>DNI:</strong> <span th:text="${paciente.dni}"></span></p>
    <a th:href="@{/elegirPaciente}" class="btn" 
       style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); margin-top: 10px;">
        CAMBIAR PACIENTE
    </a>
</div>

<div th:if="${rolUsuario == 'PACIENTE'}" class="paciente-info" 
     style="background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #28a745;">
    <h4>Mis Datos</h4>
    <p><strong>Nombre:</strong> <span th:text="${paciente.nombre + ' ' + paciente.apellido}"></span></p>
    <p><strong>DNI:</strong> <span th:text="${paciente.dni}"></span></p>
</div>
    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>


  <!-- Formulario corregido -->
  <form class="formulario" th:action="@{/estudio/continuar}" method="post">
      <input type="hidden" name="pacienteId" th:value="${paciente.id}">
      
      <!-- Selección de Estudio -->
      <div class="select-wrapper">
          <label for="estudioId"><em>Estudio:</em></label>
          <select id="estudioId" name="estudioId" required>
              <option value="">Seleccione un estudio</option>
              <option th:each="estudio : ${estudios}" 
                      th:value="${estudio.id}"
                      th:text="${estudio.nombre}">
              </option>
          </select>
      </div>

      <!-- Selección de Médico -->
      <div class="select-wrapper">
          <label for="medicoId"><em>Médico:</em></label>
          <select id="medicoId" name="medicoId" required>
              <option value="">Seleccione un médico</option>
              <option th:each="medico : ${medicos}" 
                      th:value="${medico.id}"
                      th:text="${medico.apellido + ', ' + medico.nombre + ' - ' + medico.especialidad}">
              </option>
          </select>
      </div>

      <div class="form-buttons">
          <button type="submit" class="btn btn-confirmar">
              Continuar
          </button>
      </div>
  </form>
    <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
  </main>

  <script>
    // Menú hamburguesa
    document.addEventListener('DOMContentLoaded', function() {
      const menuIcon = document.querySelector('.menu-icon');
      const sideMenu = document.querySelector('.side-menu');
      const overlay = document.querySelector('.overlay');
      const body = document.body;

      menuIcon.addEventListener('click', function() {
        sideMenu.classList.toggle('open');
        overlay.classList.toggle('active');
        body.classList.toggle('menu-open');
      });

      overlay.addEventListener('click', function() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
        body.classList.remove('menu-open');
      });
    });
  </script>
</body>
</html>
