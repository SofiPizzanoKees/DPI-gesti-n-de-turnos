<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse">
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="inicio.html" class="menu-link">Inicio</a>
      <a href="contacto.html" class="menu-link">Contacto</a>
      <a href="miperfil.html" class="menu-link">Mi Perfil</a>
      <a href="quienessomos.html" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas.html" class="menu-link">Especialistas</a>
    </nav>
  </aside>
  
  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenedor principal -->
  <div class="container-horario">

    <!-- Logo -->
    <div class="logo">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio">
    </div>

    <!-- Formulario de selección -->
    <form class="formulario">
        <!-- Especialista -->
      <div class="select-wrapper">
        <label for="especialista"><em>Especialista:</em></label>
        <select id="especialista" name="especialista" required>
          <option value="">-----------------------------</option>
          <option value="nombre1">Nombre 1</option>
          <option value="nombre2">Nombre 2</option>
          <option value="nombre3">Nombre 3</option>
          <option value="nombre4">Nombre 4</option>
        </select>
      </div>

      
      <!-- Estudio -->
      <div class="select-wrapper">
        <label for="estudio"><em>Estudio a realizar:</em></label>
        <select id="estudio" name="estudio" required>
          <option value="">-----------------------------</option>
          <option value="estudio1">Estudio 1</option>
          <option value="estudio2">Estudio 2</option>
          <option value="estudio3">Estudio 3</option>
          <option value="estudio4">Estudio 4</option>
          <option value="estudio5">Estudio 5</option>
        </select>
      </div>

      <button type="button" class="btn" onclick="window.location.href='calendario'">
        SIGUIENTE
      </button>

 
  <footer>
    2025 Turnos Online - Todos los derechos reservados
  </footer>

  <script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
</body>
</html>
