<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Estudio - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>
  
  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>
  
  <!-- Logo -->
  <main class="container">
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>

    <h3 class="title">Seleccionar Estudio Médico</h3>

<!-- En estudio.html, después del logo y antes del formulario -->
<div th:if="${rolUsuario == 'SECRETARIO'}" class="paciente-info" 
     style="background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #007bff;">
    <h4>Paciente Seleccionado</h4>
    <p><strong>Nombre:</strong> <span th:text="${paciente.nombre + ' ' + paciente.apellido}"></span></p>
    <p><strong>DNI:</strong> <span th:text="${paciente.dni}"></span></p>
    <a th:href="@{/elegirPaciente}" class="btn" 
       style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); margin-top: 10px;">
        CAMBIAR PACIENTE
    </a>
</div>

<div th:if="${rolUsuario == 'PACIENTE'}" class="paciente-info" 
     style="background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #28a745;">
    <h4>Mis Datos</h4>
    <p><strong>Nombre:</strong> <span th:text="${paciente.nombre + ' ' + paciente.apellido}"></span></p>
    <p><strong>DNI:</strong> <span th:text="${paciente.dni}"></span></p>
</div>
    <!-- Mensajes -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>


  <!-- Formulario corregido -->
  <form class="formulario" th:action="@{/estudio/continuar}" method="post">
      <input type="hidden" name="pacienteId" th:value="${paciente.id}">
      
      <!-- Selección de Estudio -->
      <div class="select-wrapper">
          <label for="estudioId"><em>Estudio:</em></label>
          <select id="estudioId" name="estudioId" required>
              <option value="">Seleccione un estudio</option>
              <option th:each="estudio : ${estudios}" 
                      th:value="${estudio.id}"
                      th:text="${estudio.nombre}">
              </option>
          </select>
      </div>

      <!-- Selección de Médico -->
      <div class="select-wrapper">
          <label for="medicoId"><em>Médico:</em></label>
          <select id="medicoId" name="medicoId" required>
              <option value="">Seleccione un médico</option>
              <option th:each="medico : ${medicos}" 
                      th:value="${medico.id}"
                      th:text="${medico.apellido + ', ' + medico.nombre + ' - ' + medico.especialidad}">
              </option>
          </select>
      </div>

      <div class="form-buttons">
          <button type="submit" class="btn btn-confirmar">
              Continuar
          </button>
      </div>
  </form>
    <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
  </main>

  <script>
    // Menú hamburguesa
    document.addEventListener('DOMContentLoaded', function() {
      const menuIcon = document.querySelector('.menu-icon');
      const sideMenu = document.querySelector('.side-menu');
      const overlay = document.querySelector('.overlay');
      const body = document.body;

      menuIcon.addEventListener('click', function() {
        sideMenu.classList.toggle('open');
        overlay.classList.toggle('active');
        body.classList.toggle('menu-open');
      });

      overlay.addEventListener('click', function() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
        body.classList.remove('menu-open');
      });

      // Inicializar event listeners para filtrado dinámico
      inicializarFiltradoDinamico();
    });

    // Variables para guardar las listas originales
    let estudiosOriginales = [];
    let medicosOriginales = [];

    // Función para inicializar el filtrado dinámico
    function inicializarFiltradoDinamico() {
      const estudioSelect = document.getElementById('estudioId');
      const medicoSelect = document.getElementById('medicoId');
      
      // Guardar las opciones originales
      estudiosOriginales = Array.from(estudioSelect.options).map(option => ({
        value: option.value,
        text: option.textContent
      }));
      
      medicosOriginales = Array.from(medicoSelect.options).map(option => ({
        value: option.value,
        text: option.textContent
      }));

      console.log('Opciones originales guardadas:', {
        estudios: estudiosOriginales.length,
        medicos: medicosOriginales.length
      });

      // Evento cuando cambia el estudio
      estudioSelect.addEventListener('change', function() {
        const estudioId = this.value;
        const medicoId = medicoSelect.value;
        
        console.log('Estudio seleccionado:', estudioId, 'Médico actual:', medicoId);
        
        if (estudioId) {
          // Si ya hay un médico seleccionado, verificar compatibilidad
          if (medicoId) {
            verificarCompatibilidad(estudioId, medicoId);
          } else {
            // Si no hay médico seleccionado, filtrar médicos por estudio
            cargarMedicosPorEstudio(estudioId);
          }
        } else {
          // Si se deselecciona el estudio, restaurar todos los médicos
          restaurarTodosLosMedicos();
        }
      });
      
      // Evento cuando cambia el médico
      medicoSelect.addEventListener('change', function() {
        const medicoId = this.value;
        const estudioId = estudioSelect.value;
        
        console.log('Médico seleccionado:', medicoId, 'Estudio actual:', estudioId);
        
        if (medicoId) {
          // Si ya hay un estudio seleccionado, verificar compatibilidad
          if (estudioId) {
            verificarCompatibilidad(estudioId, medicoId);
          } else {
            // Si no hay estudio seleccionado, filtrar estudios por médico
            cargarEstudiosPorMedico(medicoId);
          }
        } else {
          // Si se deselecciona el médico, restaurar todos los estudios
          restaurarTodosLosEstudios();
        }
      });
    }

    // Función para verificar compatibilidad entre estudio y médico seleccionados
    async function verificarCompatibilidad(estudioId, medicoId) {
      try {
        // Verificar si el médico realiza el estudio seleccionado
        const response = await fetch(`/api/verificar-compatibilidad/${estudioId}/${medicoId}`);
        const data = await response.json();
        
        if (data.success) {
          if (data.compatible) {
            mostrarMensajeTemporal('✅ Estudio y médico son compatibles', 'success');
          } else {
            mostrarMensajeTemporal('⚠️ Este médico no realiza el estudio seleccionado', 'warning');
            // Opcional: Podrías limpiar una de las selecciones aquí si quieres
            // Pero lo dejamos como advertencia para que el usuario decida
          }
        }
      } catch (error) {
        console.error('Error verificando compatibilidad:', error);
      }
    }

    // Función para cargar médicos por estudio (sin limpiar selección actual)
    async function cargarMedicosPorEstudio(estudioId) {
      const medicoSelect = document.getElementById('medicoId');
      const medicoSeleccionado = medicoSelect.value;
      
      try {
        mostrarCargandoMedicos(true);
        
        const response = await fetch(`/api/medicos-por-estudio/${estudioId}`);
        const data = await response.json();
        
        console.log('Respuesta médicos por estudio:', data);
        
        if (data.success) {
          // Guardar la selección actual antes de cambiar las opciones
          const seleccionPrevia = medicoSeleccionado;
          
          // Limpiar y repoblar select de médicos
          medicoSelect.innerHTML = '<option value="">Seleccione un médico</option>';
          
          // Agregar médicos filtrados
          data.medicos.forEach(medico => {
            const option = document.createElement('option');
            option.value = medico.id;
            option.textContent = `${medico.apellido}, ${medico.nombre} - ${medico.especialidad}`;
            medicoSelect.appendChild(option);
          });
          
          // Restaurar la selección previa si todavía está disponible
          if (seleccionPrevia && data.medicos.some(m => m.id == seleccionPrevia)) {
            medicoSelect.value = seleccionPrevia;
            console.log('Selección de médico restaurada:', seleccionPrevia);
          }
          
          // Mostrar mensaje informativo
          if (data.medicos.length > 0) {
            mostrarMensajeTemporal(`Se encontraron ${data.medicos.length} médico(s) para este estudio`, 'success');
          } else {
            mostrarMensajeTemporal('No hay médicos disponibles para este estudio', 'warning');
          }
        } else {
          mostrarMensajeTemporal('Error al cargar médicos: ' + data.message, 'error');
          restaurarTodosLosMedicos();
        }
        
      } catch (error) {
        console.error('Error cargando médicos:', error);
        mostrarMensajeTemporal('Error de conexión al cargar médicos', 'error');
        restaurarTodosLosMedicos();
      } finally {
        mostrarCargandoMedicos(false);
      }
    }

    // Función para cargar estudios por médico (sin limpiar selección actual)
    async function cargarEstudiosPorMedico(medicoId) {
      const estudioSelect = document.getElementById('estudioId');
      const estudioSeleccionado = estudioSelect.value;
      
      try {
        mostrarCargandoEstudios(true);
        
        const response = await fetch(`/api/estudios-por-medico/${medicoId}`);
        const data = await response.json();
        
        console.log('Respuesta estudios por médico:', data);
        
        if (data.success) {
          // Guardar la selección actual antes de cambiar las opciones
          const seleccionPrevia = estudioSeleccionado;
          
          // Limpiar y repoblar select de estudios
          estudioSelect.innerHTML = '<option value="">Seleccione un estudio</option>';
          
          // Agregar estudios filtrados
          data.estudios.forEach(estudio => {
            const option = document.createElement('option');
            option.value = estudio.id;
            option.textContent = estudio.nombre;
            estudioSelect.appendChild(option);
          });
          
          // Restaurar la selección previa si todavía está disponible
          if (seleccionPrevia && data.estudios.some(e => e.id == seleccionPrevia)) {
            estudioSelect.value = seleccionPrevia;
            console.log('Selección de estudio restaurada:', seleccionPrevia);
          }
          
          // Mostrar mensaje informativo
          if (data.estudios.length > 0) {
            mostrarMensajeTemporal(`Se encontraron ${data.estudios.length} estudio(s) para este médico`, 'success');
          } else {
            mostrarMensajeTemporal('No hay estudios disponibles para este médico', 'warning');
          }
        } else {
          mostrarMensajeTemporal('Error al cargar estudios: ' + data.message, 'error');
          restaurarTodosLosEstudios();
        }
        
      } catch (error) {
        console.error('Error cargando estudios:', error);
        mostrarMensajeTemporal('Error de conexión al cargar estudios', 'error');
        restaurarTodosLosEstudios();
      } finally {
        mostrarCargandoEstudios(false);
      }
    }

    // Función para restaurar todos los médicos
    function restaurarTodosLosMedicos() {
      const medicoSelect = document.getElementById('medicoId');
      const seleccionActual = medicoSelect.value;
      
      medicoSelect.innerHTML = '<option value="">Seleccione un médico</option>';
      
      medicosOriginales.forEach(medico => {
        if (medico.value) { // Saltar la opción vacía
          const option = document.createElement('option');
          option.value = medico.value;
          option.textContent = medico.text;
          medicoSelect.appendChild(option);
        }
      });
      
      // Restaurar selección si existe
      if (seleccionActual) {
        medicoSelect.value = seleccionActual;
      }
      
      console.log('Todos los médicos restaurados');
    }

    // Función para restaurar todos los estudios
    function restaurarTodosLosEstudios() {
      const estudioSelect = document.getElementById('estudioId');
      const seleccionActual = estudioSelect.value;
      
      estudioSelect.innerHTML = '<option value="">Seleccione un estudio</option>';
      
      estudiosOriginales.forEach(estudio => {
        if (estudio.value) { // Saltar la opción vacía
          const option = document.createElement('option');
          option.value = estudio.value;
          option.textContent = estudio.text;
          estudioSelect.appendChild(option);
        }
      });
      
      // Restaurar selección si existe
      if (seleccionActual) {
        estudioSelect.value = seleccionActual;
      }
      
      console.log('Todos los estudios restaurados');
    }

    // Funciones auxiliares (mantener igual)
    function mostrarCargandoMedicos(mostrar) {
      let spinner = document.getElementById('loading-medicos');
      const medicoSelect = document.getElementById('medicoId');
      
      if (mostrar) {
        if (!spinner) {
          spinner = document.createElement('div');
          spinner.id = 'loading-medicos';
          spinner.innerHTML = '🔄 Cargando médicos...';
          spinner.style.cssText = `
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            background: rgba(0, 194, 168, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
          `;
          medicoSelect.parentNode.style.position = 'relative';
          medicoSelect.parentNode.appendChild(spinner);
        }
        medicoSelect.disabled = true;
      } else {
        if (spinner) {
          spinner.remove();
        }
        medicoSelect.disabled = false;
      }
    }

    function mostrarCargandoEstudios(mostrar) {
      let spinner = document.getElementById('loading-estudios');
      const estudioSelect = document.getElementById('estudioId');
      
      if (mostrar) {
        if (!spinner) {
          spinner = document.createElement('div');
          spinner.id = 'loading-estudios';
          spinner.innerHTML = '🔄 Cargando estudios...';
          spinner.style.cssText = `
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            background: rgba(0, 194, 168, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
          `;
          estudioSelect.parentNode.style.position = 'relative';
          estudioSelect.parentNode.appendChild(spinner);
        }
        estudioSelect.disabled = true;
      } else {
        if (spinner) {
          spinner.remove();
        }
        estudioSelect.disabled = false;
      }
    }

    function mostrarMensajeTemporal(mensaje, tipo) {
      const mensajesAnteriores = document.querySelectorAll('.mensaje-temporal');
      mensajesAnteriores.forEach(msg => msg.remove());
      
      const mensajeDiv = document.createElement('div');
      mensajeDiv.className = `alert alert-${tipo} mensaje-temporal`;
      mensajeDiv.textContent = mensaje;
      mensajeDiv.style.marginTop = '10px';
      mensajeDiv.style.marginBottom = '10px';
      
      const formulario = document.querySelector('.formulario');
      formulario.insertBefore(mensajeDiv, formulario.firstChild);
      
      setTimeout(() => {
        if (mensajeDiv.parentNode) {
          mensajeDiv.parentNode.removeChild(mensajeDiv);
        }
      }, 5000);
    }

    // Validación del formulario - PERMITIR AMBOS SELECCIONADOS
    document.querySelector('form').addEventListener('submit', function(e) {
      const estudioSelect = document.getElementById('estudioId');
      const medicoSelect = document.getElementById('medicoId');
      
      // Validar que se haya seleccionado al menos uno
      if (!estudioSelect.value && !medicoSelect.value) {
        alert('Debe seleccionar al menos un estudio o un médico');
        e.preventDefault();
        return;
      }
      
      console.log('Enviando formulario con:', {
        estudioId: estudioSelect.value,
        medicoId: medicoSelect.value
      });
    });
  </script>
</body>
</html>
