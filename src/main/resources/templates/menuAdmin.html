<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnos - Diagnóstico Valle Medio</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web&display=swap" rel="stylesheet">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

   <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
  <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenedor principal -->
  <div class="container-horario">

    <!-- Logo -->
    <div class="logo">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio">
    </div>

    <!-- Botones de turnos -->
     <button type="button" class="btn" onclick="window.location.href='horarioMedico'">Editar Horarios</button>
     <button type="button" class="btn" onclick="window.location.href='editarEstudio'">Editar Estudios</button>
     <button type="button" class="btn" onclick="window.location.href='registroAdmin'">Registrar usuario</button>
    <button type="button" class="btn" onclick="window.location.href='login'">Volver</button>
  </div>

<script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>

        <span>+54 9 291 123-4567</span>

      <div class="footer-section">
        <i class="fas fa-envelope"></i>
        <span>info@centroimagen.com</span>
      </div>

        <i class="fas fa-map-marker-alt"></i>
        <span>Av. Colón 123, Bahía Blanca</span>
      </div>
      
      <div class="social-links">
        <a href="https://instagram.com" target="_blank" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://facebook.com" target="_blank" title="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://wa.me/5492911234567" target="_blank" title="WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>

    </div>
  </footer>
</body>
</html>
