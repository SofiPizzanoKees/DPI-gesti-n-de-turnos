<!-- Tarjeta central -->
<div class="container-horario">
    <div class="logo">
        <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo DPI" />
    </div>
    
    <!-- Información del rol -->
    <div th:if="${rolUsuario != null}" 
         style="background: #e8f5e8; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center;">
        <span style="font-weight: bold; color: #2c3e50;">
            <i class="fas fa-user-tag" style="margin-right: 5px;"></i>
            Perfil de <span th:text="${rolUsuario}"></span>
        </span>
    </div>
    
    <h1 class="title">Datos Personales</h1>
    
    <form id="personalDataForm">
        <!-- DNI -->
        <div class="form-group">
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" class="readonly-field" 
                   th:value="${usuario.dni}" readonly>
        </div>
        
        <!-- Nombre y Apellido -->
        <div class="form-group">
            <label for="nombre">Nombre y Apellido:</label>
            <input type="text" id="nombre" name="nombre" class="readonly-field" 
                   th:value="${usuario.nombre} + ' ' + ${usuario.apellido}" readonly>
        </div>
        
        <!-- Fecha de Nacimiento -->
        <div class="form-group">
            <label for="fechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="readonly-field" 
                   th:value="${usuario.fechaNacimiento}" readonly>
        </div>
        
        <!-- Obra Social (solo para pacientes) -->
        <div th:if="${rolUsuario == 'PACIENTE'}" class="form-group">
            <label for="obraSocial">Obra Social</label>
            <div class="field-container">
                <input type="text" id="obraSocial" name="obraSocial" class="readonly-field" 
                       th:value="${obraSocial}" readonly>
                <!-- Quitamos el botón de edición temporalmente -->
            </div>
        </div>
        
        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <div class="field-container">
                <input type="email" id="email" name="email" class="editable-field" 
                       th:value="${usuario.email}" readonly>
                <button type="button" class="edit-icon" data-field="email">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
        </div>
        
        <!-- Campos adicionales para médicos -->
        <div th:if="${rolUsuario == 'MEDICO'}">
            <!-- Especialidad -->
            <div class="form-group">
                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad" name="especialidad" class="readonly-field" 
                       th:value="${usuario.especialidad}" readonly>
            </div>
            
            <!-- Matrícula Nacional -->
            <div class="form-group">
                <label for="matriculaNacional">Matrícula Nacional</label>
                <input type="text" id="matriculaNacional" name="matriculaNacional" class="readonly-field" 
                       th:value="${usuario.matriculaNacional}" readonly>
            </div>
            
            <!-- Matrícula Provincial -->
            <div class="form-group">
                <label for="matriculaProvincial">Matrícula Provincial</label>
                <input type="text" id="matriculaProvincial" name="matriculaProvincial" class="readonly-field" 
                       th:value="${usuario.matriculaProvincial}" readonly>
            </div>
        </div>
        
        <div class="form-buttons">
            <button type="button" class="btn btn-cancelar hidden" id="cancelBtn">Cancelar</button>
            <button type="button" class="btn btn-guardar hidden" id="saveBtn">Guardar Cambios</button>
        </div>
    </form>
    
    <!-- Botón Volver dinámico - VERSIÓN CORREGIDA -->
<!-- Botón Volver universal -->
  <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const editButtons = document.querySelectorAll('.edit-icon');
      const cancelBtn = document.getElementById('cancelBtn');
      const saveBtn = document.getElementById('saveBtn');
      
      let originalValues = {};
      let currentEditingField = null;
      
      function enableEditing(fieldId) {
        if (currentEditingField && currentEditingField !== fieldId) {
          cancelEditing();
        }
        
        const field = document.getElementById(fieldId);
        originalValues[fieldId] = field.value;
        
        field.removeAttribute('readonly');
        field.classList.add('editing');
        
        cancelBtn.classList.remove('hidden');
        saveBtn.classList.remove('hidden');
        
        currentEditingField = fieldId;
        field.focus();
      }
      
      function cancelEditing() {
        if (currentEditingField) {
          const field = document.getElementById(currentEditingField);
          field.value = originalValues[currentEditingField];
          field.setAttribute('readonly', true);
          field.classList.remove('editing');
          
          cancelBtn.classList.add('hidden');
          saveBtn.classList.add('hidden');
          
          currentEditingField = null;
          originalValues = {};
        }
      }
      
async function saveChanges() {
    if (currentEditingField) {
        const field = document.getElementById(currentEditingField);
        const newValue = field.value.trim();
        
        // Validaciones básicas
        if (newValue === '') {
            alert('Este campo no puede estar vacío.');
            field.focus();
            return;
        }
        
        if (currentEditingField === 'email') {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(newValue)) {
                alert('Por favor, ingresa un email válido (ejemplo: usuario@dominio.com).');
                field.focus();
                return;
            }
        }
        
        try {
            // Mostrar indicador de carga
            mostrarCargando(true);
            
            // Preparar datos para enviar
            const formData = new FormData();
            formData.append('nuevoEmail', newValue);
            
            // Enviar solicitud al servidor
            const response = await fetch('/actualizarEmail', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Éxito: mostrar mensaje y actualizar interfaz
                mostrarMensajeExito(data.message);
                
                field.setAttribute('readonly', true);
                field.classList.remove('editing');
                
                cancelBtn.classList.add('hidden');
                saveBtn.classList.add('hidden');
                
                currentEditingField = null;
                originalValues = {};
                
                // Actualizar visualmente el email en la página
                actualizarEmailEnInterfaz(newValue);
                
            } else {
                // Error: mostrar mensaje de error
                mostrarMensajeError(data.message);
                field.focus();
            }
            
        } catch (error) {
            console.error('Error al guardar cambios:', error);
            mostrarMensajeError('Error de conexión. Por favor, intenta nuevamente.');
            field.focus();
        } finally {
            mostrarCargando(false);
        }
    }
}

// Función para mostrar mensaje de éxito
function mostrarMensajeExito(mensaje) {
    // Remover mensajes anteriores
    const mensajesAnteriores = document.querySelectorAll('.mensaje-temporal');
    mensajesAnteriores.forEach(msg => msg.remove());
    
    const mensajeDiv = document.createElement('div');
    mensajeDiv.className = 'alert alert-success mensaje-temporal';
    mensajeDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${mensaje}`;
    mensajeDiv.style.cssText = `
        margin: 15px 0;
        padding: 12px 15px;
        border-radius: 8px;
        animation: fadeIn 0.3s ease;
    `;
    
    const formulario = document.getElementById('personalDataForm');
    formulario.insertBefore(mensajeDiv, formulario.firstChild);
    
    // Auto-remover después de 5 segundos
    setTimeout(() => {
        if (mensajeDiv.parentNode) {
            mensajeDiv.parentNode.removeChild(mensajeDiv);
        }
    }, 5000);
}

// Función para mostrar mensaje de error
function mostrarMensajeError(mensaje) {
    // Remover mensajes anteriores
    const mensajesAnteriores = document.querySelectorAll('.mensaje-temporal');
    mensajesAnteriores.forEach(msg => msg.remove());
    
    const mensajeDiv = document.createElement('div');
    mensajeDiv.className = 'alert alert-error mensaje-temporal';
    mensajeDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${mensaje}`;
    mensajeDiv.style.cssText = `
        margin: 15px 0;
        padding: 12px 15px;
        border-radius: 8px;
        animation: fadeIn 0.3s ease;
    `;
    
    const formulario = document.getElementById('personalDataForm');
    formulario.insertBefore(mensajeDiv, formulario.firstChild);
    
    // Auto-remover después de 5 segundos
    setTimeout(() => {
        if (mensajeDiv.parentNode) {
            mensajeDiv.parentNode.removeChild(mensajeDiv);
        }
    }, 5000);
}

// Función para mostrar/ocultar indicador de carga
function mostrarCargando(mostrar) {
    let spinner = document.getElementById('loading-spinner');
    
    if (mostrar) {
        if (!spinner) {
            spinner = document.createElement('div');
            spinner.id = 'loading-spinner';
            spinner.innerHTML = '🔄 Guardando cambios...';
            spinner.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 194, 168, 0.9);
                color: white;
                padding: 15px 20px;
                border-radius: 8px;
                z-index: 10000;
                font-weight: bold;
            `;
            document.body.appendChild(spinner);
        }
    } else {
        if (spinner) {
            spinner.remove();
        }
    }
}

// Función para actualizar el email en la interfaz
function actualizarEmailEnInterfaz(nuevoEmail) {
    const emailField = document.getElementById('email');
    emailField.value = nuevoEmail;
    
    // También podrías actualizar otros lugares donde se muestre el email
    console.log('Email actualizado en interfaz:', nuevoEmail);
}
      
      editButtons.forEach(button => {
        button.addEventListener('click', function() {
          const fieldId = this.getAttribute('data-field');
          enableEditing(fieldId);
        });
      });
      
      cancelBtn.addEventListener('click', cancelEditing);
      saveBtn.addEventListener('click', saveChanges);
      
      document.addEventListener('keydown', function(e) {
        if (currentEditingField) {
          if (e.key === 'Enter') {
            saveChanges();
          } else if (e.key === 'Escape') {
            cancelEditing();
          }
        }
      });
    });
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
