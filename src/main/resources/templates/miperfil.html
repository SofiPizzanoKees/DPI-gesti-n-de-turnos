<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>
   <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
     <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>
  
<!-- Tarjeta central -->
<div class="container-horario">
    <div class="logo">
        <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo DPI" />
    </div>
    
    <!-- Información del rol -->
    <div th:if="${rolUsuario != null}" 
         style="background: #e8f5e8; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center;">
        <span style="font-weight: bold; color: #2c3e50;">
            <i class="fas fa-user-tag" style="margin-right: 5px;"></i>
            Perfil de <span th:text="${rolUsuario}"></span>
        </span>
    </div>
    
    <h1 class="title">Datos Personales</h1>
    
    <form id="personalDataForm">
        <!-- DNI -->
        <div class="form-group">
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" class="readonly-field" 
                   th:value="${usuario.dni}" readonly>
        </div>
        
        <!-- Nombre y Apellido -->
        <div class="form-group">
            <label for="nombre">Nombre y Apellido:</label>
            <input type="text" id="nombre" name="nombre" class="readonly-field" 
                   th:value="${usuario.nombre} + ' ' + ${usuario.apellido}" readonly>
        </div>
        
        <!-- Fecha de Nacimiento -->
        <div class="form-group">
            <label for="fechaNacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="readonly-field" 
                   th:value="${usuario.fechaNacimiento}" readonly>
        </div>
        
        <!-- Obra Social (solo para pacientes) -->
        <div th:if="${rolUsuario == 'PACIENTE'}" class="form-group">
            <label for="obraSocial">Obra Social</label>
            <div class="field-container">
                <input type="text" id="obraSocial" name="obraSocial" class="readonly-field" 
                       th:value="${obraSocial}" readonly>
                <!-- Quitamos el botón de edición temporalmente -->
            </div>
        </div>
        
        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <div class="field-container">
                <input type="email" id="email" name="email" class="editable-field" 
                       th:value="${usuario.email}" readonly>
                <button type="button" class="edit-icon" data-field="email">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
        </div>
        
        <!-- Campos adicionales para médicos -->
        <div th:if="${rolUsuario == 'MEDICO'}">
            <!-- Especialidad -->
            <div class="form-group">
                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad" name="especialidad" class="readonly-field" 
                       th:value="${usuario.especialidad}" readonly>
            </div>
            
            <!-- Matrícula Nacional -->
            <div class="form-group">
                <label for="matriculaNacional">Matrícula Nacional</label>
                <input type="text" id="matriculaNacional" name="matriculaNacional" class="readonly-field" 
                       th:value="${usuario.matriculaNacional}" readonly>
            </div>
            
            <!-- Matrícula Provincial -->
            <div class="form-group">
                <label for="matriculaProvincial">Matrícula Provincial</label>
                <input type="text" id="matriculaProvincial" name="matriculaProvincial" class="readonly-field" 
                       th:value="${usuario.matriculaProvincial}" readonly>
            </div>
        </div>
        
        <div class="form-buttons">
            <button type="button" class="btn btn-cancelar hidden" id="cancelBtn">Cancelar</button>
            <button type="button" class="btn btn-guardar hidden" id="saveBtn">Guardar Cambios</button>
        </div>
    </form>
    
    <!-- Botón Volver dinámico - VERSIÓN CORREGIDA -->
<!-- Botón Volver universal -->
  <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const editButtons = document.querySelectorAll('.edit-icon');
      const cancelBtn = document.getElementById('cancelBtn');
      const saveBtn = document.getElementById('saveBtn');
      
      let originalValues = {};
      let currentEditingField = null;
      
      function enableEditing(fieldId) {
        if (currentEditingField && currentEditingField !== fieldId) {
          cancelEditing();
        }
        
        const field = document.getElementById(fieldId);
        originalValues[fieldId] = field.value;
        
        field.removeAttribute('readonly');
        field.classList.add('editing');
        
        cancelBtn.classList.remove('hidden');
        saveBtn.classList.remove('hidden');
        
        currentEditingField = fieldId;
        field.focus();
      }
      
      function cancelEditing() {
        if (currentEditingField) {
          const field = document.getElementById(currentEditingField);
          field.value = originalValues[currentEditingField];
          field.setAttribute('readonly', true);
          field.classList.remove('editing');
          
          cancelBtn.classList.add('hidden');
          saveBtn.classList.add('hidden');
          
          currentEditingField = null;
          originalValues = {};
        }
      }
      
function saveChanges() {
    if (currentEditingField) {
        const field = document.getElementById(currentEditingField);
        
        if (currentEditingField === 'email') {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(field.value)) {
                alert('Por favor, ingresa un email válido.');
                field.focus();
                return;
            }
        }
        
        if (field.value.trim() === '') {
            alert('Este campo no puede estar vacío.');
            field.focus();
            return;
        }
        
        // Aquí puedes agregar una llamada AJAX para guardar en el servidor
        // Por ahora solo mostramos un mensaje
        alert('Cambios guardados correctamente (función en desarrollo).');
        
        field.setAttribute('readonly', true);
        field.classList.remove('editing');
        
        cancelBtn.classList.add('hidden');
        saveBtn.classList.add('hidden');
        
        currentEditingField = null;
        originalValues = {};
    }
}
      
      editButtons.forEach(button => {
        button.addEventListener('click', function() {
          const fieldId = this.getAttribute('data-field');
          enableEditing(fieldId);
        });
      });
      
      cancelBtn.addEventListener('click', cancelEditing);
      saveBtn.addEventListener('click', saveChanges);
      
      document.addEventListener('keydown', function(e) {
        if (currentEditingField) {
          if (e.key === 'Enter') {
            saveChanges();
          } else if (e.key === 'Escape') {
            cancelEditing();
          }
        }
      });
    });
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
</body>
