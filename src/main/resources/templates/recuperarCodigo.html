<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Código - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

   <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenido principal -->
  <div class="container">
    <!-- 🔹 Encabezado con logo -->
    <header class="header">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio" class="logologin">
    </header>

    <!-- Título -->
    <h2 class="title">VERIFICAR CÓDIGO</h2>

    <!-- Mensajes de error -->
    <div th:if="${error}" class="alert alert-error">
      <span th:text="${error}"></span>
    </div>

    <!-- Formulario -->
    <form class="login-form" th:action="@{/verificarCodigo}" method="post">
      
      <!-- Campo oculto para mantener el email -->
      <input type="hidden" id="email" name="email" th:value="${email}">
      
      <input type="text" id="codigo" name="codigo" required placeholder="Ingrese el código recibido por mail" maxlength="6">
      <button type="submit" class="btn">SIGUIENTE</button>
    </form>
  </div>
    <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
     <footer>
    <div class="footer-content">
      <div class="footer-section">
        <i class="fas fa-mobile-alt"></i>
        <span>+54 9 291 123-4567</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-envelope"></i>
        <span>info@centroimagen.com</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-map-marker-alt"></i>
        <span>Av. Colón 123, Bahía Blanca</span>
      </div>
      
      <div class="social-links">
        <a href="https://instagram.com" target="_blank" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://facebook.com" target="_blank" title="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://wa.me/5492911234567" target="_blank" title="WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>

    </div>
  </footer>
  <script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });

    // Validar que solo se ingresen números en el código
    document.getElementById('codigo').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  </script>

  <style>
    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
    <script>
  // Prevenir el error de extensiones
  document.addEventListener('DOMContentLoaded', function() {
      // Limpiar cualquier listener problemático
      if (window.chrome && window.chrome.runtime) {
          console.log('Navegador Chrome detectado - ignorando errores de extensiones');
      }
  });

  // Manejar el envío del formulario de forma más robusta
  document.querySelector('form').addEventListener('submit', function(e) {
      console.log('Formulario enviado - procesando código...');
      // El formulario se enviará normalmente via POST
  });

  // Validación adicional del código
  document.getElementById('codigo').addEventListener('blur', function() {
      const codigo = this.value.trim();
      if (codigo.length !== 6) {
          console.warn('El código debe tener 6 dígitos');
      }
  });
  </script>
</body>
</html>
