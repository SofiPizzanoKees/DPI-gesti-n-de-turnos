<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Estudios - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse">
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
   <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>
  
  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenedor principal -->
  <div class="container-horario">
    <!-- Logo -->
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>
    
    <!-- Mensajes de éxito/error -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    
    <!-- CONTENEDOR DE BOTONES -->
    <div class="button-container">
        <button class="main-button add-button" onclick="mostrarFormularioAgregar()">Agregar Estudio</button>
        <button class="main-button delete-button" onclick="mostrarFormularioEliminar()">Eliminar Estudio</button>
    </div>
    
    <!-- Formulario para agregar estudio -->
    <div id="formularioAgregar" style="display:none; margin-top: 20px;">
        <h2>Agregar Nuevo Estudio</h2>
        <form th:action="@{/agregarEstudio}" method="post" id="agregarForm">
            <label for="nombre">Nombre del estudio:</label><br>
            <input type="text" id="nombre" name="nombre" required maxlength="100"><br><br>
            
            <label for="descripcion">Descripción:</label><br>
            <textarea id="descripcion" name="descripcion" rows="4" cols="50" maxlength="500"></textarea><br><br>
            
            <div class="form-buttons">
                <button type="submit" class="form-button save-button">Guardar Estudio</button>
                <button type="button" class="form-button cancel-button" onclick="ocultarFormularios()">Cancelar</button>
            </div>
        </form>
    </div>
    
    <!-- Formulario para eliminar estudio -->
    <div id="formularioEliminar" style="display:none; margin-top: 20px;">
        <h2>Eliminar Estudio</h2>
        <form th:action="@{/eliminarEstudio}" method="post" id="eliminarForm">
            <label for="estudioId">Selecciona un estudio para eliminar:</label><br>
            <select id="estudioId" name="estudioId" required>
                <option value="">Seleccione un estudio...</option>
                <option th:each="estudio : ${estudios}" 
                        th:value="${estudio.id}"
                        th:text="${estudio.nombre}">
                </option>
            </select><br><br>
            
            <div class="form-buttons">
                <button type="submit" class="form-button delete-form-button">Eliminar Estudio</button>
                <button type="button" class="form-button cancel-button" onclick="ocultarFormularios()">Cancelar</button>
            </div>
        </form>
    </div>

    <!-- Lista de estudios existentes -->
    <div th:if="${not #lists.isEmpty(estudios)}" style="margin-top: 30px;">
        <h3>Estudios Existentes</h3>
        <ul style="list-style-type: none; padding: 0;">
            <li th:each="estudio : ${estudios}" 
                style="background: #f5f5f5; margin: 10px 0; padding: 15px; border-radius: 5px;">
                <strong th:text="${estudio.nombre}"></strong>
                <p th:if="${estudio.descripcion}" 
                   th:text="${estudio.descripcion}" 
                   style="margin: 5px 0; color: #666;"></p>
            </li>
        </ul>
    </div>

  </div>

  <script>
    // Función para mostrar el formulario de agregar
    function mostrarFormularioAgregar() {
        document.getElementById('formularioAgregar').style.display = 'block';
        document.getElementById('formularioEliminar').style.display = 'none';
        document.querySelector('.button-container').style.display = 'none';
    }
    
    // Función para mostrar el formulario de eliminar
    function mostrarFormularioEliminar() {
        document.getElementById('formularioEliminar').style.display = 'block';
        document.getElementById('formularioAgregar').style.display = 'none';
        document.querySelector('.button-container').style.display = 'none';
    }
    
    // Función para ocultar ambos formularios
    function ocultarFormularios() {
        document.getElementById('formularioAgregar').style.display = 'none';
        document.getElementById('formularioEliminar').style.display = 'none';
        document.querySelector('.button-container').style.display = 'block';
    }

    // Script del menú hamburguesa
    document.addEventListener('DOMContentLoaded', function() {
        const menuToggle = document.getElementById('menu-toggle');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        menuToggle.addEventListener('click', function() {
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('active');
            document.body.classList.toggle('menu-open');
        });

        overlay.addEventListener('click', function() {
            sideMenu.classList.remove('open');
            overlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        });
    });
  </script>

</body>
</html>
