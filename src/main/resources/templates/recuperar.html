<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

   <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
   <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenido principal -->
  <div class="container">
    <!-- 🔹 Encabezado con logo -->
    <header class="header">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio" class="logologin">
    </header>

    <!-- Título -->
    <h2 class="title">RECUPERAR CONTRASEÑA</h2>

    <!-- 🔴 MENSAJES DE ERROR -->
    <div th:if="${error}" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span th:text="${error}"></span>
    </div>

    <!-- Formulario -->
    <form class="login-form" th:action="@{/recuperarCodigo}" method="post">
      <input type="email" id="email" name="email" required 
             placeholder="Ingrese su email" th:class="${error != null} ? 'input-error' : ''">
      <button type="submit" class="btn">SIGUIENTE</button>
    </form>

    <!-- Link para volver al login -->
    <div class="text-center" style="margin-top: 20px;">
      <a href="login" class="back-link">← Volver al Login</a>
    </div>
  </div>

  
   <footer>
      2025 Turnos Online - Todos los derechos reservados
    </footer>
  

  <script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });

    // Limpiar error cuando el usuario empiece a escribir
    document.getElementById('email').addEventListener('input', function() {
      if (this.classList.contains('input-error')) {
        this.classList.remove('input-error');
        // También podrías ocultar el mensaje de error aquí si quieres
      }
    });
  </script>

  <style>
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    
    .alert-error {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    
    .input-error {
      border-color: #dc2626 !important;
      background-color: #fef2f2;
    }
    
    .back-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    .text-center {
      text-align: center;
    }
  </style>
</body>
</html>
