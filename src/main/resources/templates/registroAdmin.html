<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Paciente</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse">
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

   <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="inicio.html" class="menu-link">Inicio</a>
      <a href="contacto.html" class="menu-link">Contacto</a>
      <a href="miperfil.html" class="menu-link">Mi Perfil</a>
      <a href="quienessomos.html" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas.html" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenido principal -->
  <main class="container">
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>

    <!-- Formulario -->
    <form class="formulario" th:action="@{/dpi}" method="post">
      <h3>Datos personales:</h3>

      <!-- Mostrar errores generales -->
      <div th:if="${errorDni}" class="alert alert-error" th:text="${errorDni}"></div>
      <div th:if="${errorPassword}" class="alert alert-error" th:text="${errorPassword}"></div>

      <div class="input-group">
        <label>DNI</label>
        <input type="text" th:field="*{dni}" placeholder="----------" 
               maxlength="8"
               oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        
        <!-- Mensaje de error solo cuando existe -->
        <div th:if="${#fields.hasErrors('dni')}" class="error-message">
          <span th:errors="*{dni}"></span>
      </div>
      
       <div class="input-group">
        <label>Nombre</label>
        <input type="text" name="nombre" id="nombre" placeholder="----------" 
               th:value="${nombre != null ? nombre : param.nombre}"
               maxlength="30"
               minlength="2"
               pattern="[A-Za-zÁáÉéÍíÓóÚúÑñ\s]{2,30}"
               title="El nombre debe tener entre 2 y 30 caracteres (solo letras y espacios)"
               required
               oninput="validarNombre(this)">
        <small class="text-muted">Entre 2 y 30 caracteres (solo letras)</small>
        <div id="error-nombre" class="error-message" style="display: none; color: red; font-size: 12px;"></div>
      </div>

      </div>

      <div class="input-group">
        <label>Apellido</label>
        <input type="text" name="apellido" id="apellido" placeholder="----------" 
               th:value="${apellido != null ? apellido : param.apellido}"
               maxlength="30"
               minlength="2"
               pattern="[A-Za-zÁáÉéÍíÓóÚúÑñ\s]{2,30}"
               title="El apellido debe tener entre 2 y 30 caracteres (solo letras y espacios)"
               required
               oninput="validarApellido(this)">
        <small class="text-muted">Entre 2 y 30 caracteres (solo letras)</small>
        <div id="error-apellido" class="error-message" style="display: none; color: red; font-size: 12px;"></div>
      </div>

      <div class="input-group"> 
        <label>Teléfono</label>
        <input type="text" name="telefono" id="telefono" placeholder="---15-----" 
               th:value="${telefono != null ? telefono : param.telefono}"
               maxlength="10"
               pattern="\d{10}"
               title="El teléfono debe tener exactamente 10 dígitos"
               required
               oninput="validarTelefono(this)">
        <small class="text-muted">Debe tener exactamente 10 dígitos</small>
        <div id="error-telefono" class="error-message" style="display: none; color: red; font-size: 12px;"></div>
      </div>

      <div class="input-group">
    <label>Fecha de Nacimiento</label>
    <input type="date" 
           name="fechaNacimiento" 
           th:field="*{fechaNacimiento}"
           max="th:${T(java.time.LocalDate).now().minusYears(18).toString()}"
           min="1900-01-01"
           required
           title="Debe ser mayor de 18 años">
    
    <!-- Mensajes de error -->
    <div th:if="${#fields.hasErrors('fechaNacimiento')}" class="error-message">
        <span th:errors="*{fechaNacimiento}"></span>
    </div>
    
    <small class="text-muted" th:unless="${#fields.hasErrors('fechaNacimiento')}">
        Debe ser mayor de 18 años
    </small>
</div>

      <div class="input-group">
    <label>Email</label>
    <input type="email" th:field="*{email}" placeholder="ejemplo@correo.com">
    
    <!-- Se muestra error despues de que el usuario escribe su mail -->
    <div th:if="${#fields.hasErrors('email') and usuario.email != null and !usuario.email.empty}" 
         class="error-message">
        <span th:errors="*{email}"></span>
    </div>
    
    <small class="text-muted" th:unless="${#fields.hasErrors('email')}">
        Ingrese un email válido 
    </small>
</div>

      <div class="input-group">
        <label>Obra Social</label>
        <select name="obrasocial">
          <option value="">Seleccione...</option>
          <option value="IPROSS" th:selected="${obrasocial == 'IPROSS' or param.obrasocial == 'IPROSS'}">IPROSS</option>
          <option value="PAMI" th:selected="${obrasocial == 'PAMI' or param.obrasocial == 'PAMI'}">PAMI</option>
          <option value="OTROS" th:selected="${obrasocial == 'OTROS' or param.obrasocial == 'OTROS'}">OTROS</option>
        </select>
      </div>


      <button type="submit" class="btn" >SIGUIENTE</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    2025 Turnos Online - Todos los derechos reservados
  </footer>

  <!-- JavaScript para validación en tiempo real -->
  <script>
    // Validar DNI en tiempo real
    document.querySelector('input[name="dni"]').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value.length > 8) {
        this.value = this.value.slice(0, 8);
      }
    });

    // Validar teléfono en tiempo real
    document.querySelector('input[name="telefono"]').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  </script>

<script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
</body>
</html>
