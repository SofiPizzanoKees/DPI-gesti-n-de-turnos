<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
 <!-- Contenedor principal -->
  <div class="container-horario">
<body>
<body>
  <div class="logo">
      <img src="../assets/LOGO DPI.jpg" alt="Logo DPI" />
    </div>

  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse">
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="contacto.html" class="menu-link">Contacto</a>
      <a href="turnos.html" class="menu-link">Turnos</a>
      <a href="quienes-somos.html" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas.html" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

    <!-- Texto informativo -->
    <div class="calendar-container">

      <div class="legend">
        <span class="legend-item ocupado"> NO disponible</span>
        <span class="legend-item disponible">Lugares disponibles</span>
      </div>

      <!-- Header con mes y botones -->
      <div class="calendar-header">
        <button id="prev">◀</button>
        <h3 id="month-year"></h3>
        <button id="next">▶</button>
      </div>

      <!-- Encabezado de los días -->
      <div class="weekdays">
        <div>Lun</div>
        <div>Mar</div>
        <div>Mié</div>
        <div>Jue</div>
        <div>Vie</div>
        <div>Sáb</div>
        <div>Dom</div>
      </div>

      <!-- Contenedor de días dinámicos -->
      <div class="calendar" id="calendar"></div>
      

      <!-- 🔹 Botón corregido -->
      <button type="button" class="btn" onclick="window.location.href='horarios'">
      ELEGIR TURNO
      </button>

      <!-- Botón volver -->
      <button type="button" class="btn" onclick="window.location.href='estudio'">VOLVER</button>
    </div>

    <footer>
      2025 Turnos Online - Todos los derechos reservados
    </footer>
  </div>

  <script src="../js/calendario.js"></script>
  <script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
</body>
</html>
