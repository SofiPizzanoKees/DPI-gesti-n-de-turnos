  <!-- SCRIPT DEL CALENDARIO - DIRECTAMENTE EN EL HTML -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log("🎯 CALENDARIO INICIADO DESDE HTML");
        console.log("Días disponibles:", diasDisponibles);
        
        const calendar = document.getElementById('calendar');
        const monthYear = document.getElementById('month-year');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');

        let currentDate = new Date();
        let selectedDate = null;

        function renderCalendar() {
            console.log("📅 RENDERIZANDO CALENDARIO...");
            calendar.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const firstDayOfWeek = firstDay.getDay();
            
            // CÁLCULO CORREGIDO DE ESPACIOS
            const startEmptyDays = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;

            console.log(`Mes: ${month + 1}/${year}, Días: ${daysInMonth}, Primer día: ${firstDayOfWeek}, Espacios: ${startEmptyDays}`);

            // Header
            monthYear.textContent = currentDate.toLocaleDateString('es-ES', { 
                year: 'numeric', 
                month: 'long' 
            });

            // Espacios vacíos
            for (let i = 0; i < startEmptyDays; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day empty';
                calendar.appendChild(emptyDay);
            }

            // Días del mes
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.className = 'day';
                dayElement.textContent = day;
                
                const dayOfWeek = date.getDay();
                const dayName = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'][dayOfWeek];
                const isAvailable = diasDisponibles.includes(dayOfWeek);
                const isPast = date < new Date();

                console.log(`Día ${day} (${dayName}): Disponible = ${isAvailable}`);

                if (isPast) {
                    dayElement.classList.add('pasado');
                } else if (isAvailable) {
                    dayElement.classList.add('disponible');
                    dayElement.addEventListener('click', () => selectDate(dayElement, date));
                } else {
                    dayElement.classList.add('no-disponible');
                }

                calendar.appendChild(dayElement);
            }
        }

        function selectDate(dayElement, date) {
            document.querySelectorAll('.day.selected').forEach(el => {
                el.classList.remove('selected');
            });
            dayElement.classList.add('selected');
            selectedDate = date;
            
            const inputFecha = document.getElementById('inputFechaSeleccionada');
            if (inputFecha) {
                inputFecha.value = selectedDate.toISOString().split('T')[0];
            }
            
            console.log('📍 Fecha seleccionada:', date.toLocaleDateString('es-ES'));
        }

        // Navegación
        prevBtn.addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            selectedDate = null;
            renderCalendar();
        });

        nextBtn.addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            selectedDate = null;
            renderCalendar();
        });

        // Botón
        const btnElegirTurno = document.getElementById('btnElegirTurno');
        if (btnElegirTurno) {
            btnElegirTurno.addEventListener('click', function(e) {
                if (!selectedDate) {
                    alert('❌ Por favor selecciona una fecha disponible');
                    e.preventDefault();
                    return false;
                }
                console.log("📤 Enviando formulario...");
            });
        }

        // Inicializar
        renderCalendar();
    });
  </script>

  <!-- SCRIPT DEL MENÚ -->
  <script>
    // Elementos del DOM para el menú
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners del menú
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
