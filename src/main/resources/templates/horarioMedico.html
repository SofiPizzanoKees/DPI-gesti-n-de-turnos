<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidad Médica</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>
  
  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>
  
  <!-- Logo -->
  <main class="container">
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>

    <h3 class="title">Configura tus horarios de atención</h3>

    <!-- Mensajes de éxito/error -->
    <div th:if="${success}" class="alert alert-success" th:utext="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Formulario de selección -->
    <form class="formulario" th:action="@{/guardarHorarios}" method="post">
        <!-- Especialista -->
        <div class="select-wrapper">
            <label for="medicoId"><em>Especialista:</em></label>
            <select id="medicoId" name="medicoId" required onchange="cargarHorariosMedico()">
                <option value="">Seleccione un especialista</option>
                <option th:each="medico : ${medicos}" 
                        th:value="${medico.id}"
                        th:text="${medico.apellido + ', ' + medico.nombre + ' - ' + medico.especialidad}">
                </option>
            </select>
        </div>

        <!-- Lista de días con horarios -->
        <div class="dias-horarios">
            <!-- Lunes -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="lunes" name="lunes" class="dia-checkbox">
                    <label for="lunes" class="dia-label">Lunes</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="lunes-desde" id="lunes-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="lunes-hasta" id="lunes-hasta">
                    </div>
                </div>
            </div>

            <!-- Martes -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="martes" name="martes" class="dia-checkbox">
                    <label for="martes" class="dia-label">Martes</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="martes-desde" id="martes-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="martes-hasta" id="martes-hasta">
                    </div>
                </div>
            </div>

            <!-- Miércoles -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="miercoles" name="miercoles" class="dia-checkbox">
                    <label for="miercoles" class="dia-label">Miércoles</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="miercoles-desde" id="miercoles-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="miercoles-hasta" id="miercoles-hasta">
                    </div>
                </div>
            </div>

            <!-- Jueves -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="jueves" name="jueves" class="dia-checkbox">
                    <label for="jueves" class="dia-label">Jueves</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="jueves-desde" id="jueves-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="jueves-hasta" id="jueves-hasta">
                    </div>
                </div>
            </div>

            <!-- Viernes -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="viernes" name="viernes" class="dia-checkbox">
                    <label for="viernes" class="dia-label">Viernes</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="viernes-desde" id="viernes-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="viernes-hasta" id="viernes-hasta">
                    </div>
                </div>
            </div>

            <!-- Sábado -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="sabado" name="sabado" class="dia-checkbox">
                    <label for="sabado" class="dia-label">Sábado</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="sabado-desde" id="sabado-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="sabado-hasta" id="sabado-hasta">
                    </div>
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn btn-confirmar">Guardar horarios</button>
    </form>
      <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
  </main>
    <footer>
    <div class="footer-content">
      <div class="footer-section">
        <i class="fas fa-mobile-alt"></i>
        <span>+54 9 291 123-4567</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-envelope"></i>
        <span>info@centroimagen.com</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-map-marker-alt"></i>
        <span>Tello 337, Choele Choel, Argentina</span>
      </div>
      
      <div class="social-links">
        <a href="https://www.instagram.com/dpi_vallemedio/" target="_blank" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.facebook.com/DPIValleMedio" target="_blank" title="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://wa.me/0294615508112" target="_blank" title="WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>

    </div>
  </footer>

    </footer>

  <script>
    // JavaScript para el menú hamburguesa y funcionalidad de horarios
    document.addEventListener('DOMContentLoaded', function() {
      const menuIcon = document.querySelector('.menu-icon');
      const sideMenu = document.querySelector('.side-menu');
      const overlay = document.querySelector('.overlay');
      const body = document.body;

      menuIcon.addEventListener('click', function() {
        sideMenu.classList.toggle('open');
        overlay.classList.toggle('active');
        body.classList.toggle('menu-open');
      });

      overlay.addEventListener('click', function() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
        body.classList.remove('menu-open');
      });

      // Inicializar estado de los campos (todos deshabilitados al inicio)
      const checkboxes = document.querySelectorAll('.dia-checkbox');
      checkboxes.forEach(checkbox => {
        const diaHorario = checkbox.closest('.dia-horario');
        const timeInputs = diaHorario.querySelectorAll('.time-input');
        timeInputs.forEach(input => {
          input.disabled = true;
        });
        
        // Event listener para checkboxes
        checkbox.addEventListener('change', function() {
          const diaKey = this.id;
          const inputDesde = document.getElementById(diaKey + '-desde');
          const inputHasta = document.getElementById(diaKey + '-hasta');
          
          inputDesde.disabled = !this.checked;
          inputHasta.disabled = !this.checked;
          
          if (!this.checked) {
            inputDesde.value = '';
            inputHasta.value = '';
          }
        });
      });
    });

// Mapeo CORREGIDO de días en español a enum
const diasMap = {
    'lunes': 'LUNES',
    'martes': 'MARTES', 
    'miercoles': 'MIERCOLES',  // ← Cambiado de 'MIERCOLES' a 'MIERCOLES'
    'jueves': 'JUEVES',
    'viernes': 'VIERNES',
    'sabado': 'SABADO'
};

console.log('Mapeo de días configurado:', diasMap);

    // Función para cargar horarios del médico seleccionado
    async function cargarHorariosMedico() {
        const medicoSelect = document.getElementById('medicoId');
        const medicoId = medicoSelect.value;
        
        console.log('Cargando horarios para médico ID:', medicoId);
        
        if (!medicoId) {
            // Limpiar todos los campos si no hay médico seleccionado
            limpiarTodosLosHorarios();
            return;
        }
        
        try {
            // Mostrar indicador de carga
            mostrarCargando(true);
            
            const response = await fetch(`/api/horarios-medico/${medicoId}`);
            const data = await response.json();
            
            if (data.success) {
                console.log('Horarios cargados:', data.horarios);
                cargarHorariosEnFormulario(data.horarios);
                mostrarMensaje(`Horarios cargados para: ${data.medico}`, 'success');
            } else {
                console.error('Error cargando horarios:', data.message);
                limpiarTodosLosHorarios();
                mostrarMensaje('No se encontraron horarios configurados para este médico', 'info');
            }
            
        } catch (error) {
            console.error('Error en la solicitud:', error);
            limpiarTodosLosHorarios();
            mostrarMensaje('Error al cargar los horarios', 'error');
        } finally {
            mostrarCargando(false);
        }
    }
    
// Función para cargar horarios en el formulario
function cargarHorariosEnFormulario(horarios) {
    console.log('Horarios recibidos del servidor:', horarios);
    
    Object.keys(diasMap).forEach(diaKey => {
        const diaEnum = diasMap[diaKey];
        const horarioDia = horarios[diaEnum];
        
        const checkbox = document.getElementById(diaKey);
        const inputDesde = document.getElementById(diaKey + '-desde');
        const inputHasta = document.getElementById(diaKey + '-hasta');
        
        console.log(`Procesando ${diaKey} -> ${diaEnum}:`, horarioDia);
        
        if (horarioDia && horarioDia.horaInicio && horarioDia.horaFin) {
            // Hay horario configurado para este día
            checkbox.checked = true;
            inputDesde.value = horarioDia.horaInicio;
            inputHasta.value = horarioDia.horaFin;
            inputDesde.disabled = false;
            inputHasta.disabled = false;
            
            console.log(`✅ Cargado ${diaKey}: ${horarioDia.horaInicio} - ${horarioDia.horaFin}`);
        } else {
            // No hay horario configurado para este día
            checkbox.checked = false;
            inputDesde.value = '';
            inputHasta.value = '';
            inputDesde.disabled = true;
            inputHasta.disabled = true;
            
            console.log(`❌ Sin horario para ${diaKey}`);
        }
    });
    
    // Mostrar resumen
    const diasConHorario = Object.keys(diasMap).filter(diaKey => {
        return document.getElementById(diaKey).checked;
    });
    console.log(`Días con horario cargados: ${diasConHorario.length} - ${diasConHorario.join(', ')}`);
}
    
    // Función para limpiar todos los horarios
    function limpiarTodosLosHorarios() {
        Object.keys(diasMap).forEach(diaKey => {
            const checkbox = document.getElementById(diaKey);
            const inputDesde = document.getElementById(diaKey + '-desde');
            const inputHasta = document.getElementById(diaKey + '-hasta');
            
            checkbox.checked = false;
            inputDesde.value = '';
            inputHasta.value = '';
            inputDesde.disabled = true;
            inputHasta.disabled = true;
        });
        
        console.log('Todos los horarios limpiados');
    }
    
    // Función para mostrar mensajes
    function mostrarMensaje(mensaje, tipo) {
        // Remover mensajes anteriores
        const mensajesAnteriores = document.querySelectorAll('.mensaje-temporal');
        mensajesAnteriores.forEach(msg => msg.remove());
        
        const mensajeDiv = document.createElement('div');
        mensajeDiv.className = `alert alert-${tipo} mensaje-temporal`;
        mensajeDiv.textContent = mensaje;
        mensajeDiv.style.marginTop = '10px';
        
        const formulario = document.querySelector('.formulario');
        formulario.insertBefore(mensajeDiv, formulario.firstChild);
        
        // Auto-remover después de 5 segundos
        setTimeout(() => {
            if (mensajeDiv.parentNode) {
                mensajeDiv.parentNode.removeChild(mensajeDiv);
            }
        }, 5000);
    }
    
    // Función para mostrar/ocultar indicador de carga
    function mostrarCargando(mostrar) {
        let spinner = document.getElementById('loading-spinner');
        
        if (mostrar) {
            if (!spinner) {
                spinner = document.createElement('div');
                spinner.id = 'loading-spinner';
                spinner.innerHTML = '🔄 Cargando horarios...';
                spinner.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 194, 168, 0.9);
                    color: white;
                    padding: 15px 20px;
                    border-radius: 8px;
                    z-index: 10000;
                    font-weight: bold;
                `;
                document.body.appendChild(spinner);
            }
        } else {
            if (spinner) {
                spinner.remove();
            }
        }
    }

    // Validación antes de enviar el formulario
    document.querySelector('form').addEventListener('submit', function(e) {
        const medicoSelect = document.getElementById('medicoId');
        if (!medicoSelect.value) {
            alert('Por favor, seleccione un médico');
            e.preventDefault();
            return;
        }
        
        // Verificar que al menos un día tenga horario completo
        let tieneHorariosValidos = false;
        Object.keys(diasMap).forEach(diaKey => {
            const checkbox = document.getElementById(diaKey);
            const inputDesde = document.getElementById(diaKey + '-desde');
            const inputHasta = document.getElementById(diaKey + '-hasta');
            
            if (checkbox.checked && inputDesde.value && inputHasta.value) {
                // Validar que la hora de inicio sea antes que la de fin
                if (inputDesde.value >= inputHasta.value) {
                    alert(`Error en ${diaKey}: La hora de inicio debe ser anterior a la hora de fin`);
                    e.preventDefault();
                    return;
                }
                tieneHorariosValidos = true;
            } else if (checkbox.checked && (!inputDesde.value || !inputHasta.value)) {
                alert(`Error en ${diaKey}: Si el día está marcado, debe completar ambos horarios`);
                e.preventDefault();
                return;
            }
        });
        
        if (!tieneHorariosValidos) {
            alert('Debe configurar al menos un día con horario completo');
            e.preventDefault();
            return;
        }
        
        if (!confirm('¿Está seguro de guardar los cambios? Se verificarán y procesarán automáticamente los turnos afectados.')) {
            e.preventDefault();
        }
    });
  </script>
</body>
</html>
