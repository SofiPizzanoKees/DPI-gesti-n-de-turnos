<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidad Médica</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>
  
  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>
  
  <!-- Logo -->
  <main class="container">
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>

    <h3 class="title">Configura tus horarios de atención</h3>

    <!-- Mensajes de éxito/error -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Formulario de selección -->
    <form class="formulario" th:action="@{/guardarHorarios}" method="post">
        <!-- Especialista -->
        <div class="select-wrapper">
            <label for="medicoId"><em>Especialista:</em></label>
            <select id="medicoId" name="medicoId" required>
                <option value="">Seleccione un especialista</option>
                <option th:each="medico : ${medicos}" 
                        th:value="${medico.id}"
                        th:text="${medico.apellido + ', ' + medico.nombre + ' - ' + medico.especialidad}">
                </option>
            </select>
        </div>

        <!-- Lista de días con horarios -->
        <div class="dias-horarios">
            <!-- Lunes -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="lunes" name="lunes" class="dia-checkbox">
                    <label for="lunes" class="dia-label">Lunes</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="lunes-desde" id="lunes-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="lunes-hasta" id="lunes-hasta">
                    </div>
                </div>
            </div>

            <!-- Martes -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="martes" name="martes" class="dia-checkbox">
                    <label for="martes" class="dia-label">Martes</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="martes-desde" id="martes-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="martes-hasta" id="martes-hasta">
                    </div>
                </div>
            </div>

            <!-- Miércoles -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="miercoles" name="miercoles" class="dia-checkbox">
                    <label for="miercoles" class="dia-label">Miércoles</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="miercoles-desde" id="miercoles-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="miercoles-hasta" id="miercoles-hasta">
                    </div>
                </div>
            </div>

            <!-- Jueves -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="jueves" name="jueves" class="dia-checkbox">
                    <label for="jueves" class="dia-label">Jueves</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="jueves-desde" id="jueves-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="jueves-hasta" id="jueves-hasta">
                    </div>
                </div>
            </div>

            <!-- Viernes -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="viernes" name="viernes" class="dia-checkbox">
                    <label for="viernes" class="dia-label">Viernes</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="viernes-desde" id="viernes-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="viernes-hasta" id="viernes-hasta">
                    </div>
                </div>
            </div>

            <!-- Sábado -->
            <div class="dia-horario">
                <div class="dia-header">
                    <input type="checkbox" id="sabado" name="sabado" class="dia-checkbox">
                    <label for="sabado" class="dia-label">Sábado</label>
                </div>
                <div class="horario-fields">
                    <div class="time-group">
                        <label>Desde:</label>
                        <input type="time" class="time-input" name="sabado-desde" id="sabado-desde">
                    </div>
                    <div class="time-group">
                        <label>Hasta:</label>
                        <input type="time" class="time-input" name="sabado-hasta" id="sabado-hasta">
                    </div>
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn btn-confirmar">Guardar horarios</button>
    </form>
  </main>

  <script>
    // JavaScript para el menú hamburguesa
    document.addEventListener('DOMContentLoaded', function() {
      const menuIcon = document.querySelector('.menu-icon');
      const sideMenu = document.querySelector('.side-menu');
      const overlay = document.querySelector('.overlay');
      const body = document.body;

      menuIcon.addEventListener('click', function() {
        sideMenu.classList.toggle('open');
        overlay.classList.toggle('active');
        body.classList.toggle('menu-open');
      });

      overlay.addEventListener('click', function() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
        body.classList.remove('menu-open');
      });

      // Habilitar/deshabilitar campos de horario según checkbox
      const checkboxes = document.querySelectorAll('.dia-checkbox');
      checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
          const diaHorario = this.closest('.dia-horario');
          const timeInputs = diaHorario.querySelectorAll('.time-input');
          
          timeInputs.forEach(input => {
            input.disabled = !this.checked;
            if (!this.checked) {
              input.value = ''; // Limpiar valores cuando se desactiva
            }
          });
        });
        
        // Inicializar estado de los campos
        const diaHorario = checkbox.closest('.dia-horario');
        const timeInputs = diaHorario.querySelectorAll('.time-input');
        timeInputs.forEach(input => {
          input.disabled = !checkbox.checked;
        });
      });
    });
  </script>
</body>
</html>
