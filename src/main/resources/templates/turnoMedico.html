<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnos - Diagnóstico Valle Medio</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web&display=swap" rel="stylesheet">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

   <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
  <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenedor principal -->
  <div class="container-horario">

    <!-- Logo -->
    <div class="logo">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio">
    </div>

  <div class="turnos-grid">
    <!-- Turnos dinámicos -->
    <div th:each="turno : ${turnos}" class="turno-card" th:attr="data-turno-id=${turno.idTurno}">
        <div class="turno-header">
            <div class="turno-numero">
                <i class="fas fa-calendar-check"></i>
                Turno #<span th:text="${turno.idTurno}"></span>
            </div>
          <span class="turno-estado" th:classappend="'turno-estado-' + ${turno.estado.toLowerCase()}"
                th:text="${turno.estado}">
              Confirmado
          </span>
        </div>
        
        <div class="turno-details">
            <div class="detail-row">
                <i class="fas fa-calendar-day"></i>
                <span class="detail-label">Fecha:</span>
                <span class="detail-value editable" contenteditable="false">
                    <input type="date" th:value="${#temporals.format(turno.fecha, 'yyyy-MM-dd')}" disabled>
                </span>
            </div>
            
            <div class="detail-row">
                <i class="fas fa-clock"></i>
                <span class="detail-label">Hora:</span>
                <span class="detail-value editable" contenteditable="false">
                    <input type="time" th:value="${#temporals.format(turno.hora, 'HH:mm')}" disabled>
                </span>
            </div>
            
            <div class="detail-row">
                <i class="fas fa-user"></i>
                <span class="detail-label">Paciente:</span>
                <span class="detail-value" th:text="${turno.paciente.nombre + ' ' + turno.paciente.apellido}">
                    Juan García
                </span>
            </div>
            
            <div class="detail-row">
                <i class="fas fa-stethoscope"></i>
                <span class="detail-label">Estudio:</span>
                <span class="detail-value" th:text="${turno.estudio.nombre}">
                    Radiografía de Tórax
                </span>
            </div>
            
            <div class="detail-row" th:if="${turno.codigoTurno}">
                <i class="fas fa-barcode"></i>
                <span class="detail-label">Código:</span>
                <span class="detail-value" th:text="${turno.codigoTurno}">
                    T2412151234
                </span>
            </div>
        </div>
        
        <div class="turno-actions">
            <button class="btn-accion btn-cancelar-turno" 
                    th:onclick="|cancelarTurno(${turno.idTurno})|"
                    th:disabled="${turno.estado == 'CANCELADO' || turno.estado == 'COMPLETADO'}">
                <i class="fas fa-times"></i>
                <span th:text="${turno.estado == 'CANCELADO'} ? 'Cancelado' : 'Cancelar'">Cancelar</span>
            </button>
        </div>
    </div>

    <!-- Mensaje cuando no hay turnos -->
    <div th:if="${#lists.isEmpty(turnos)}" class="no-turnos">
        <i class="fas fa-calendar-times"></i>
        <h3>No hay turnos asignados</h3>
        <p>No tienes turnos programados para mostrar.</p>
    </div>
</div>
  <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <i class="fas fa-mobile-alt"></i>
        <span>+54 9 291 123-4567</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-envelope"></i>
        <span>info@centroimagen.com</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-map-marker-alt"></i>
        <span>Av. Colón 123, Bahía Blanca</span>
      </div>
      
      <div class="social-links">
        <a href="https://instagram.com" target="_blank" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://facebook.com" target="_blank" title="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://wa.me/5492911234567" target="_blank" title="WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>

    </div>
  </footer>
<script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
    // Variables para rastrear cambios
    
let turnosModificados = new Set();

// Función para cancelar turno
function cancelarTurno(turnoId) {
  if (confirm('¿Está seguro que desea cancelar este turno?')) {
    const card = document.querySelector(`[data-turno-id="${turnoId}"]`);
    card.style.opacity = '0.5';
    card.style.pointerEvents = 'none';
    
    const estado = card.querySelector('.turno-estado');
    estado.textContent = 'Cancelado';
    estado.style.background = 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)';
    
    turnosModificados.add(turnoId);
    habilitarGuardado();
    
    // Aquí irían las acciones para cancelar en el backend
    console.log(`Turno ${turnoId} cancelado`);
  }
}

// Función para habilitar el botón de guardar
function habilitarGuardado() {
  const btnGuardar = document.getElementById('btnGuardarCambios');
  if (turnosModificados.size > 0) {
    btnGuardar.disabled = false;
    btnGuardar.style.animation = 'pulse 1.5s infinite';
  }
}

// Función para guardar todos los cambios
function guardarCambios() {
  if (turnosModificados.size === 0) return;
  
  // Recopilar todos los datos modificados
  const cambios = [];
  turnosModificados.forEach(turnoId => {
    const card = document.querySelector(`[data-turno-id="${turnoId}"]`);
    const fecha = card.querySelector('input[type="date"]').value;
    const hora = card.querySelector('input[type="time"]').value;
    
    cambios.push({
      id: turnoId,
      fecha: fecha,
      hora: hora
    });
  });
  
  console.log('Guardando cambios:', cambios);
  
  // Aquí iría la llamada al backend
  alert('Cambios guardados exitosamente');
  
  // Resetear el estado
  turnosModificados.clear();
  document.getElementById('btnGuardarCambios').disabled = true;
  document.getElementById('btnGuardarCambios').style.animation = 'none';
  
  // Remover indicadores de modificación
  document.querySelectorAll('.turno-card.modificado').forEach(card => {
    card.classList.remove('modificado');
  });
}

// Agregar animación de pulso al CSS
const style = document.createElement('style');
style.textContent = `
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
`;
document.head.appendChild(style);


// Función para cancelar turno
function cancelarTurno(turnoId) {
    const card = document.querySelector(`[data-turno-id="${turnoId}"]`);
    const estado = card.querySelector('.turno-estado').textContent;
    
    if (estado === 'CANCELADO') {
        alert('Este turno ya está cancelado');
        return;
    }
    
    if (estado === 'COMPLETADO') {
        alert('No se puede cancelar un turno completado');
        return;
    }
    
    if (confirm('¿Está seguro que desea cancelar este turno?')) {
        // Aquí iría la llamada AJAX para cancelar en el backend
        cancelarTurnoBackend(turnoId);
    }
}

// Función para cancelar turno en el backend
function cancelarTurnoBackend(turnoId) {
    // Mostrar confirmación
    if (!confirm('¿Está seguro que desea cancelar este turno? Se enviará una notificación al paciente.')) {
        return;
    }
    
    // Crear formulario para enviar la solicitud
    const formData = new FormData();
    formData.append('turnoId', turnoId);
    
    fetch('/cancelarTurnoMedico', {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => {
        if (response.redirected) {
            window.location.href = response.url;
            return;
        }
        return response.text();
    })
    .then(data => {
        // Si llegamos aquí, fue una respuesta exitosa sin redirección
        const card = document.querySelector(`[data-turno-id="${turnoId}"]`);
        
        // Actualizar interfaz
        card.style.opacity = '0.7';
        
        const estado = card.querySelector('.turno-estado');
        estado.textContent = 'CANCELADO';
        estado.className = 'turno-estado turno-estado-cancelado';
        
        const btnCancelar = card.querySelector('.btn-cancelar-turno');
        btnCancelar.disabled = true;
        btnCancelar.innerHTML = '<i class="fas fa-times"></i> Cancelado';
        
        // Mostrar mensaje de éxito
        alert('Turno cancelado exitosamente. Se ha notificado al paciente.');
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error al cancelar el turno');
    });
}
  </script>
</body>
</html>
