<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Paciente</title>
   <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
</head>
<body>
  <header>
    <header>
     <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon">
      <i class="fas fa-bars"></i>
    </div>
  </header>
  <main class="container">
    <div class="logo">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio">
      <h2>Diagnóstico Por Imagen <br><span>VALLE MEDIO</span></h2>
    <h1>Usuarios Registrados</h1>
    <table>
    <thead>
        <tr>
            <th>ID</th>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Estado</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.dni}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.apellido}"></td>
            <td th:text="${u.telefono}"></td>
            <td th:text="${u.rol}"></td>
            <td th:text="${u.estado ? 'Activo' : 'Inactivo'}"></td>
        </tr>
    </tbody>
</table>
<button type="button" class="btn" onclick="window.location.href='login'">Volver</button>
  </main>
  <footer>
  2025 Turnos Online - Todos los derechos reservados
</footer>
</body>
</html>
