<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidad Médica</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>
  
  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>
  
  <!-- Logo -->
  <main class="container">
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>

    <h3 class="title">Elegi el paciente para sacarle un turno medico</h3>

    <!-- Mensajes de éxito/error -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Formulario de selección -->
    <form class="formulario" th:action="@{/seleccionarPaciente}" method="post">
        <!-- Paciente -->
        <div class="select-wrapper">
            <label for="pacienteId"><em>Pacientes:</em></label>
            <select id="pacienteId" name="pacienteId" required>
                <option value="">Seleccione un paciente</option>
                <option th:each="paciente : ${pacientes}" 
                        th:value="${paciente.id}"
                        th:text="${paciente.apellido + ', ' + paciente.nombre + ' - DNI: ' + paciente.dni}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-confirmar">Continuar</button>
    </form>
      <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="history.back()"
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver
      </button>
  </div>
  </main>
    <footer>
    <div class="footer-content">
      <div class="footer-section">
        <i class="fas fa-mobile-alt"></i>
        <span>+54 9 291 123-4567</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-envelope"></i>
        <span>info@centroimagen.com</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-map-marker-alt"></i>
        <span>Tello 337, Choele Choel, Argentina</span>
      </div>
      
      <div class="social-links">
        <a href="https://www.instagram.com/dpi_vallemedio/" target="_blank" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.facebook.com/DPIValleMedio" target="_blank" title="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://wa.me/0294615508112" target="_blank" title="WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>

    </div>
  </footer>

  <script>
    // JavaScript para el menú hamburguesa
    document.addEventListener('DOMContentLoaded', function() {
      const menuIcon = document.querySelector('.menu-icon');
      const sideMenu = document.querySelector('.side-menu');
      const overlay = document.querySelector('.overlay');
      const body = document.body;

      menuIcon.addEventListener('click', function() {
        sideMenu.classList.toggle('open');
        overlay.classList.toggle('active');
        body.classList.toggle('menu-open');
      });

      overlay.addEventListener('click', function() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
        body.classList.remove('menu-open');
      });

      // Habilitar/deshabilitar campos de horario según checkbox
      const checkboxes = document.querySelectorAll('.dia-checkbox');
      checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
          const diaHorario = this.closest('.dia-horario');
          const timeInputs = diaHorario.querySelectorAll('.time-input');
          
          timeInputs.forEach(input => {
            input.disabled = !this.checked;
            if (!this.checked) {
              input.value = ''; // Limpiar valores cuando se desactiva
            }
          });
        });
        
        // Inicializar estado de los campos
        const diaHorario = checkbox.closest('.dia-horario');
        const timeInputs = diaHorario.querySelectorAll('.time-input');
        timeInputs.forEach(input => {
          input.disabled = !checkbox.checked;
        });
      });
    });
  </script>
</body>
</html>
