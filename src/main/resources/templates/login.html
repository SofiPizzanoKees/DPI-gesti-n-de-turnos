<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Turnos Online</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Iconos de menú -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse"></p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="login" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenido principal -->
  <div class="container">
    <!-- 🔹 Encabezado con logo -->
    <header class="header">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio" class="logologin">
    </header>

    <!-- Título -->
    <h2 class="title">TURNOS ONLINE</h2>

    <!-- Formulario de login -->
    <form class="login-form" th:action="@{/login}" method="post">
      <label for="dni">DNI</label>
      <input type="text" id="dni" name="dni" required placeholder="Ingrese su dni">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Ingrese su contraseña">
      <button type="submit" class="btn">INGRESAR</button>
    </form>
    
    <!-- Mensaje de error si falla el login -->
    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <!-- Enlaces adicionales -->
    <div class="links">
      <!-- 🔗 Conexión agregada al recuperar.html -->
      <p><a th:href="@{/recuperar}">¿Olvidaste tu contraseña? Aquí.</a></p>
      <p><a th:href="@{/dpi}">¿No tienes usuario? Regístrate aquí.</a></p>
    </div>
      <div style="margin-top: 20px;">
      <button type="button" class="btn" onclick="window.location.href='inicio'" 
              style="background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);">
          <i class="fas fa-arrow-left" style="margin-right: 8px;"></i>
          Volver al inicio
      </button>
  </div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <i class="fas fa-mobile-alt"></i>
        <span>+54 9 291 123-4567</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-envelope"></i>
        <span>info@centroimagen.com</span>
      </div>
      
      <div class="footer-section">
        <i class="fas fa-map-marker-alt"></i>
        <span>Tello 337, Choele Choel, Argentina</span>
      </div>
      
      <div class="social-links">
        <a href="https://www.instagram.com/dpi_vallemedio/" target="_blank" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.facebook.com/DPIValleMedio" target="_blank" title="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://wa.me/0294615508112" target="_blank" title="WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>

    </div>
  </footer>

  <script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para alternar menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', closeMenu);
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
</body>
</html>
