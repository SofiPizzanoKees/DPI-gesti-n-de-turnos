<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Lateral - Diagnóstico Por Imagen</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior -->
  <header class="top-bar">
    <p class="registrarse">SOLICITAR TURNO</p>
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="inicio.html" class="menu-link">Inicio</a>
      <a href="miperfil" class="menu-link">Mi Perfil</a>
      <a href="quienessomos.html" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas.html" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenido principal -->
  <main class="container">
    <div class="logo">
      <img src="../assets/LOGO DPI.jpg" alt="Logo Valle Medio">
    </div>

    <button class="btn-principal" onclick="window.location.href='verturnos'">VER MIS TURNOS</button>
    <button class="btn-principal" onclick="window.location.href='pedirturno'">PEDIR TURNO</button>
  </main>

  <script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
</body>
</html>
