<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Paciente</title>
  
  <!-- CSS propio -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
  
  <!-- Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Barra superior con menú hamburguesa -->
  <header class="top-bar">
    <p class="registrarse">
    <div class="menu-icon" id="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

   <!-- Menú lateral -->
  <aside id="sideMenu" class="side-menu">
    <nav class="menu-nav">
      <a href="inicio.html" class="menu-link">Inicio</a>
      <a href="contacto.html" class="menu-link">Contacto</a>
      <a href="miperfil.html" class="menu-link">Mi Perfil</a>
      <a href="quienessomos.html" class="menu-link">¿Quiénes somos?</a>
      <a href="especialistas.html" class="menu-link">Especialistas</a>
    </nav>
  </aside>

  <!-- Overlay para cerrar menú al hacer click fuera -->
  <div class="overlay" id="overlay"></div>

  <!-- Contenido principal -->
  <main class="container">
    <div class="logo">
      <img th:src="@{/assets/LOGO DPI.jpg}" alt="Logo Valle Medio">
    </div>

    <!-- Formulario -->
    <form class="formulario" th:action="@{/dpi}" method="post">
      <h3>Datos personales:</h3>

      <!-- Mostrar errores generales -->
      <div th:if="${errorDni}" class="alert alert-error" th:text="${errorDni}"></div>
      <div th:if="${errorPassword}" class="alert alert-error" th:text="${errorPassword}"></div>

      <div class="input-group">
        <label>DNI</label>
        <input type="text" name="dni" placeholder="----------" 
               th:value="${dni != null ? dni : param.dni}"
               maxlength="8"
               oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <small class="text-muted">Debe tener exactamente 8 digitos</small>
      </div>

      <div class="input-group">
        <label>Nombre</label>
        <input type="text" name="nombre" placeholder="----------" 
               th:value="${nombre != null ? nombre : param.nombre}">
      </div>

      <div class="input-group">
        <label>Apellido</label>
        <input type="text" name="apellido" placeholder="----------" 
               th:value="${apellido != null ? apellido : param.apellido}">
      </div>

      <div class="input-group">
        <label>Teléfono</label>
        <input type="text" name="telefono" placeholder="---15-----" 
               th:value="${telefono != null ? telefono : param.telefono}"
               oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      </div>

      <div class="input-group">
        <label>Fecha de Nacimiento</label>
        <input type="date" name="fecha" th:value="${fecha != null ? fecha : param.fecha}">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="----------" 
               th:value="${email != null ? email : param.email}">
      </div>

      <div class="input-group">
        <label>Obra Social</label>
        <select name="obrasocial">
          <option value="">Seleccione...</option>
          <option value="IPROSS" th:selected="${obrasocial == 'IPROSS' or param.obrasocial == 'IPROSS'}">IPROSS</option>
          <option value="PAMI" th:selected="${obrasocial == 'PAMI' or param.obrasocial == 'PAMI'}">PAMI</option>
          <option value="OTROS" th:selected="${obrasocial == 'OTROS' or param.obrasocial == 'OTROS'}">OTROS</option>
        </select>
      </div>
      
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="********" required
               th:value="${param.password}">
        <small class="text-muted">Mínimo 6 caracteres</small>
      </div>

      <div class="input-group">
        <label>Confirmar Contraseña</label>
        <input type="password" name="confirm_password" placeholder="********" required
               th:value="${param.confirm_password}">
      </div>

      <button type="submit" class="btn" >SIGUIENTE</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    2025 Turnos Online - Todos los derechos reservados
  </footer>

  <!-- JavaScript para validación en tiempo real -->
  <script>
    // Validar DNI en tiempo real
    document.querySelector('input[name="dni"]').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value.length > 8) {
        this.value = this.value.slice(0, 8);
      }
    });

    // Validar teléfono en tiempo real
    document.querySelector('input[name="telefono"]').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  </script>

<script>
    // Elementos del DOM
    const menuToggle = document.getElementById('menu-toggle');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    const menuLinks = document.querySelectorAll('.menu-link');
    const body = document.body;

    // Función para abrir menú
    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('active');
      body.classList.add('menu-open');
    }

    // Función para cerrar menú
    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('menu-open');
    }

    // Función para toggle menú
    function toggleMenu() {
      if (sideMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    // Event listeners
    menuToggle.addEventListener('click', toggleMenu);
    
    // Cerrar menú al hacer click en el overlay
    overlay.addEventListener('click', closeMenu);
    
    // Cerrar menú al hacer click en un enlace
    menuLinks.forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Cerrar menú con la tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });
  </script>
</body>
</html>
