# Base de datos local MySQL (para desarrollo)
spring.datasource.url=jdbc:mysql://localhost:3306/dpi_bd?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate para MySQL local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SendGrid Configuration (puedes usar uno de prueba localmente)
spring.sendgrid.api-key=fake-key-for-local-dev
app.email.from=dpi.vallemedio1@gmail.com
app.email.from-name=Centro Médico DPI